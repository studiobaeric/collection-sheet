# GitHub-Release mit den Notizen aus CHANGELOG.md (docs/RELEASE.md, Schritt 7).
# Läuft beim Push eines Tags v… und wenn auf GitHub ein Release veröffentlicht wird. Gibt es den Release noch nicht,
# legt der Workflow ihn an (Titel = Tag, Vorabversion bei einem Bindestrich in der Version). Gibt es ihn schon, etwa
# von Hand mit eigenem Namen angelegt, bekommt er die Notizen aus CHANGELOG.md, Name und Rest bleiben.
name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Notizen aus CHANGELOG.md
        run: node tools/release.js --print-notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Release anlegen oder Notizen setzen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            pre=""
            case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $pre
          fi
