      impN(c.pruefOffen) + ' Zeilen aus der Prüfliste sind noch offen und werden') + ' nicht importiert.' +
      '<div class="actions"><button class="btn" onclick="impOpenReview()">Zur Prüfliste</button></div></div>';
  }
  var hm = r.handMatch || [];
  if (hm.length) {
    html += '<h3>Schon von Hand erfasst (' + hm.length + ')</h3><div class="hint">Diese Karten hast du schon von Hand eingetragen. ' +
      'Ist es dieselbe Karte, zählt sie nicht doppelt. Der Eintrag von Hand bleibt so, wie er ist.</div>';
    hm.forEach(function (h, k) {
      var ch = pv.hand[h.fp];
      html += '<div class="item">' + imgTag(cardImg(h.image, 'low')) + '<div class="info"><div class="t">' + esc(h.title) + '</div>' +
        '<div class="s">' + esc(h.sub) + '</div><div class="s">In der Tabelle: ' + esc(h.qty) + ', von Hand: ' + esc(h.handCount) + '</div>' +
        '<label class="imp-opt"><input type="radio" name="impHm' + k + '" id="impHmS' + k + '" value="same"' + (ch === 'same' ? ' checked' : '') +
        ' onchange="impPvHand(' + k + ',this.value)"><span>Dieselbe Karte</span></label>' +
        '<label class="imp-opt"><input type="radio" name="impHm' + k + '" id="impHmE' + k + '" value="extra"' + (ch === 'extra' ? ' checked' : '') +
        ' onchange="impPvHand(' + k + ',this.value)"><span>Zusätzliches Exemplar</span></label></div></div>';
    });
  }
  var rb = r.removedByYou || [];
  if (rb.length) {
    html += '<h3>Von dir entfernt (' + rb.length + ')</h3><div class="hint">Diese Exemplare hast du nach einem früheren Import selbst entfernt, ' +
      'z. B. weil du sie verkauft hast. Sie bleiben weg, außer du setzt den Haken.</div>';
    rb.forEach(function (x, k) {
      html += '<div class="item">' + imgTag(cardImg(x.image, 'low')) + '<div class="info"><div class="t">' + esc(x.title) + '</div>' +
        '<div class="s">' + esc(x.sub) + ' · ' + esc(x.qty) + ' Stück</div>' +
        '<label class="check"><input type="checkbox" id="impRb' + k + '" onchange="impPvRemoved(' + k + ',this.checked)"' + (pv.removed[x.fp] ? ' checked' : '') +
        '> trotzdem übernehmen</label></div></div>';
    });
  }
  var ad = r.added || [];
  if (ad.length) {
    html += '<h3>Neu (' + ad.length + ')</h3>';
    var lim = pv.showAll ? ad.length : Math.min(ad.length, 50);
    for (var k = 0; k < lim; k++) {
      var a = ad[k];
      html += '<div class="item">' + imgTag(cardImg(a.image, 'low')) + '<div class="info"><div class="t">' + esc(a.title) + '</div>' +
        '<div class="s">' + esc(a.sub) + (a.newGroup ? ' · neu in der Sammlung' : ' · mehr Exemplare') + '</div></div>' +
        '<div class="ctl"><span class="cnt">+' + esc(a.qty) + '</span></div></div>';
    }
    if (lim < ad.length) html += '<div class="actions"><button class="btn" onclick="impPvShowAll()">Alle ' + ad.length + ' zeigen</button></div>';
  }
  var de = r.decreased || [];
  if (de.length) {
    html += '<h3>Weniger (Abgleich) (' + de.length + ')</h3><div class="hint">Stehen in deiner Tabelle nicht mehr oder seltener drin.</div>';
    de.forEach(function (x) {
      html += '<div class="item"><div class="info"><div class="t">' + esc(x.title) + '</div><div class="s">' + esc(x.sub) +
        (x.fromImport != null && x.fromImport !== '' ? ' · aus Import ' + esc(x.fromImport) : '') + '</div></div>' +
        '<div class="ctl"><span class="cnt">−' + esc(x.qty) + '</span></div></div>';
    });
  }
  var sk = r.skipped || [];
  if (sk.length) {
    html += '<h3>Übersprungen (' + sk.length + ')</h3>';
    sk.forEach(function (x) {
      html += '<div class="erow"><div class="einfo">' + esc(x.title) + '<div class="x">' + esc(x.reason) + '</div></div></div>';
    });
  }
  html += '<div class="actions"><button class="btn" onclick="impDiscard(\'preview\')">Abbrechen</button>' +
    '<button class="btn primary" onclick="impCommit()">Importieren</button></div><div id="impAct"></div>' +
    '<button class="imp-link" onclick="impPvLater()">Später weitermachen</button>';
  $('impMain').innerHTML = html;
}

/** Zur Übersicht, ohne etwas zu verwerfen: der Entwurf bleibt, das Banner führt zurück in die Vorschau */
function impPvLater() {
  if (impBusy) return;
  impLoadStart('Der Import bleibt in Arbeit. Mit „Weitermachen“ geht es später weiter.');
}

function impPvHand(k, v) {
  var h = impS.pv && (impS.pv.res.handMatch || [])[k];
  if (!h) return;
  impS.pv.hand[h.fp] = v === 'extra' ? 'extra' : 'same';
  impPvRecount();
}

function impPvRemoved(k, on) {
  var x = impS.pv && (impS.pv.res.removedByYou || [])[k];
  if (!x) return;
  impS.pv.removed[x.fp] = !!on;
  impPvRecount();
}

function impPvShowAll() { if (impS.pv && !impBusy) { impS.pv.showAll = true; impRenderPreview(); } }

/** importCommit mit den Entscheidungen aus der Vorschau; Zahlen rechnet der Server selbst neu */
function impCommit() {
  var pv = impS.pv;
  if (!pv || impBusy) return;
  var choices = impPvChoices();
  impPvSeq++; // eine noch laufende Neuberechnung der Zahlen zählt nicht mehr
  impAsk('importCommit', [choices], 'Importiere … das kann einen Moment dauern.', function (res) {
    res = res || {};
    loadUiConfig();
    impLoadStart(res.message || ('Import ' + (res.nr != null ? res.nr + ' ' : '') + 'ist fertig.'));
  }, function (e) {
    var t = impErrText(e);
    // Abgebrochen oder Entwurf verworfen: in der Vorschau geht es nicht weiter, die Liste zeigt „Fortsetzen“
    if (/unterbrochen|verworfen/i.test(t)) {
      loadUiConfig();
      impLoadStart();
      setMsg('impMsg', esc(t), 'err');
      return;
    }
    impErr(e);
  });
}

// ---------- 6. Zurücknehmen ----------

function impOpenUndo(k) {
  var imp = impS.st && impS.st.imports && impS.st.imports[k];
  if (!imp || impBusy) return;
  var nr = imp.nr;
  var gen = impGo('undo');
  spinner('impMain', 'Prüfe, was beim Zurücknehmen passiert …');
  call('importUndoPreview', nr).then(function (res) {
    if (gen !== impGen) return;
    impS.ud = { nr: nr, res: res || {}, dec: {} };
    impRenderUndo();
  }, function (e) {
    if (gen !== impGen) return;
    impLoadFailed(e, '');
  });
}

/** "70 Einträge werden gelöscht, 5 auf den alten Stand gesetzt, 2 von Hand geänderte zur Entscheidung." */
function impUndoText(c, nChanged) {
  var l = impN(c.loeschen), z = impN(c.zurueck), f = impN(c.fehlt), b = impN(c.bleiben), parts = [];
  if (l) parts.push(l === 1 ? '1 Eintrag wird gelöscht' : l + ' Einträge werden gelöscht');
  if (z) parts.push(z + (l ? '' : (z === 1 ? ' wird' : ' werden')) + ' auf den alten Stand gesetzt');
  if (nChanged) parts.push(nChanged === 1 ? '1 von Hand geänderter zur Entscheidung' : nChanged + ' von Hand geänderte zur Entscheidung');
  if (b) parts.push(b === 1 ? '1 Exemplar, das du von Hand dazugezählt hast, bleibt' : b + ' Exemplare, die du von Hand dazugezählt hast, bleiben');
  if (f) parts.push(f === 1 ? '1 Eintrag ist schon nicht mehr da' : f + ' Einträge sind schon nicht mehr da');
  return parts.length ? parts.join(', ') + '.' : 'Es gibt nichts mehr zu löschen. Der Import wird nur als zurückgenommen vermerkt.';
}

function impUdItemText(t) {
  if (t && typeof t === 'object') return String(t.term || t.name || t.text || JSON.stringify(t));
  return String(t == null ? '' : t);
}

function impRenderUndo() {
  var ud = impS.ud, r = ud.res, ch = r.changed || [];
  var html = '<h2>Import ' + esc(r.nr != null ? r.nr : ud.nr) + ' zurücknehmen</h2>' +
    (r.sourceName ? '<div class="imp-sub">' + esc(r.sourceName) + '</div>' : '') +
    '<div class="box"><div id="impUdText">' + esc(impUndoText(r.counts || {}, ch.length)) + '</div>' +
    '<div class="hint">Was du von Hand hinzugefügt hast, bleibt immer. Begriffe, Set-Zuordnungen und Vorlagen bleiben auch.</div></div>';
  var later = r.laterSameSource || [];
  if (later.length) {
    html += '<div class="notes">Spätere Importe derselben Tabelle (' + later.map(function (n) { return 'Nr. ' + esc(n); }).join(', ') +
      ') bleiben, wie sie sind.</div>';
  }
  if ((r.newTerms || []).length) html += '<div class="notes">Bleiben erhalten: ' + r.newTerms.map(function (t) { return esc(impUdItemText(t)); }).join(', ') + '</div>';
  if (ch.length) {
    html += '<h3>Von Hand geändert (' + ch.length + ')</h3><div class="hint">Diese Exemplare hast du nach dem Import geändert. Entscheide bei jedem, ob es bleibt.</div>';
    ch.forEach(function (x, k) {
      var d = ud.dec[x.eid];
      html += '<div class="box"><div><b>' + esc(x.title) + '</b></div><div class="imp-sub">' + esc(x.sub) +
        (x.count != null ? ' · ' + esc(x.count) + ' Stück' : '') + '</div>' +
        ((x.changes || []).length ? '<div class="hint">Geändert: ' + x.changes.map(esc).join(', ') + '</div>' : '') +
        '<div class="row"><label class="imp-opt"><input type="radio" name="impUd' + k + '" id="impUdK' + k + '" value="keep"' + (d === 'keep' ? ' checked' : '') +
        ' onchange="impUdPick(' + k + ',this.value)"><span>Behalten</span></label>' +
        '<label class="imp-opt"><input type="radio" name="impUd' + k + '" id="impUdR' + k + '" value="remove"' + (d === 'remove' ? ' checked' : '') +
        ' onchange="impUdPick(' + k + ',this.value)"><span>Entfernen</span></label></div></div>';
    });
  }
  html += '<div class="hint" id="impUdHint">' + esc(impUdHint()) + '</div>' +
    '<div class="actions"><button class="btn" onclick="impUdCancel()">Abbrechen</button>' +
    '<button class="btn primary" id="impUdGo" onclick="impUndo()"' + (impUdReady() ? '' : ' disabled') + '>Zurücknehmen</button></div><div id="impAct"></div>';
  $('impMain').innerHTML = html;
}

function impUdReady() {
  var ud = impS.ud;
  return !!ud && (ud.res.changed || []).every(function (x) { return ud.dec[x.eid] === 'keep' || ud.dec[x.eid] === 'remove'; });
}

function impUdHint() {
  var ud = impS.ud, n = (ud.res.changed || []).filter(function (x) { return !ud.dec[x.eid]; }).length;
  return n ? 'Noch ' + n + ' zu entscheiden, dann kannst du zurücknehmen.' : '';
}

function impUdPick(k, v) {
  var ud = impS.ud, x = ud && (ud.res.changed || [])[k];
  if (!x || impBusy) return;
  ud.dec[x.eid] = v === 'remove' ? 'remove' : 'keep';
  if ($('impUdGo')) $('impUdGo').disabled = !impUdReady();
  if ($('impUdHint')) $('impUdHint').textContent = impUdHint();
}

function impUdCancel() { if (!impBusy) impLoadStart(); }

function impUndo() {
  var ud = impS.ud;
  if (!ud || impBusy || !impUdReady()) return;
  var decisions = {};
  (ud.res.changed || []).forEach(function (x) { decisions[x.eid] = ud.dec[x.eid]; });
  impAsk('importUndo', [ud.nr, decisions], 'Nehme Import ' + ud.nr + ' zurück …', function (res) {
    res = res || {};
    loadUiConfig();
    impLoadStart(res.message || ('Import ' + ud.nr + ' ist zurückgenommen.'));
  });
}
</script>
